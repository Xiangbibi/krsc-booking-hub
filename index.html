<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRSC Booking Hub Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F1E8;font-family:'IBM Plex Sans Thai','Leelawadee UI','Thonburi','Tahoma',system-ui,sans-serif;color:#16241D}
button,input{font:inherit}
.serif{font-family:'Noto Serif Thai','Leelawadee UI',Georgia,serif}
.muted{color:#5E6B63}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#9A7A2E}
.card{background:#FFF;border:1px solid #E8E1D1;border-radius:18px;box-shadow:0 1px 2px rgba(20,50,42,.04),0 8px 24px rgba(20,50,42,.06)}
.topnav{position:sticky;top:0;z-index:5;background:#0F1A16;display:flex;gap:6px;padding:8px 16px;flex-wrap:wrap;align-items:center}
.topnav .lbl{color:#B9C4B9;font-size:12px;margin-right:8px}
.tn{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#E9E4D6;cursor:pointer;font-size:14px;min-height:40px}
.tn-on{padding:8px 14px;border-radius:10px;border:1px solid #D9B860;background:#D9B860;color:#14322A;cursor:pointer;font-size:14px;font-weight:700;min-height:40px}
.btn{font-size:15px;padding:13px 22px;min-height:48px;border-radius:12px;border:none;background:#1E4D3A;color:#FFF;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(30,77,58,.25)}
.btn:hover{background:#14322A}
.btn-sec{font-size:14px;padding:11px 16px;min-height:46px;border-radius:12px;border:1px solid #C9C1AF;background:#FFF;color:#3B4A42;font-weight:600;cursor:pointer}
.btn-link{font-size:13px;font-weight:600;color:#1E4D3A;background:none;border:1px solid #C9D9CF;border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
.btn-link:hover{background:#EEF4F0}
.chip{font-size:14px;padding:9px 14px;min-height:42px;border-radius:12px;border:1px solid #DDD5C3;background:#FFF;color:#16241D;cursor:pointer}
.chip:hover{border-color:#1E4D3A}
.chip-on{font-size:14px;padding:9px 14px;min-height:42px;border-radius:12px;border:1.5px solid #1E4D3A;background:#1E4D3A;color:#FFF;cursor:pointer;font-weight:600}
.lbl2{font-size:13px;font-weight:600;color:#3B4A42}
.inp{font-size:15px;padding:11px 14px;min-height:46px;border-radius:12px;border:1px solid #DDD5C3;background:#FCFBF7;color:#16241D;width:100%}
.inp-err{font-size:15px;padding:11px 14px;min-height:46px;border-radius:12px;border:1.5px solid #B42318;background:#FFF8F7;width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;gap:16px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.t-scout{background:#DDEBE2;color:#1E4D3A}.t-youth{background:#D9EEF0;color:#155E63}.t-corp{background:#F3E6CC;color:#6B4A0F}.t-family{background:#E9E1F2;color:#4A3373}
.p-ok{background:#E4F0E8;color:#1E4D3A}.p-wait{background:#FBF0D5;color:#7A5A12}.p-warn{background:#FDE7E4;color:#912018}.p-none{background:#F3F0E8;color:#4B4F4A}
.bar-scout,.bar-youth,.bar-corp,.bar-family{display:block;width:100%;height:6px;border-radius:4px}
.bar-scout{background:#2F6B4F}.bar-youth{background:#2A8C93}.bar-corp{background:#C49A3C}.bar-family{background:#8A6BBE}
.dot{font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;white-space:nowrap}
.d-done{background:#1E4D3A;color:#FFF}.d-now{background:#FFF;color:#7A5A12;border:1.5px solid #B8913A}.d-todo{background:#F3F0E8;color:#8A877E}
/* customer */
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:#8A877E}
.step.on{color:#14322A;font-weight:700}.step.done{color:#1E4D3A}
.sn{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1.5px solid currentColor}
.type{text-align:left;padding:20px;border-radius:16px;border:1.5px solid #E8E1D1;background:#FFF;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px;color:#16241D}

.type.on{border:2px solid #1E4D3A;background:#F2F7F3}
.house{text-align:left;padding:14px;border-radius:14px;border:1px solid #E1DACB;background:#FFF;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px;color:#16241D}
.house:hover{border-color:#1E4D3A}
.house.on{border:2px solid #1E4D3A;background:#F2F7F3}
.house.off{border:1px dashed #D6D0C2;background:#F3F0E8;color:#8A877E;cursor:not-allowed}
.bar{height:8px;border-radius:99px;background:#EEE8DB;overflow:hidden}
.fill{height:8px;border-radius:99px}
.chat{display:flex;flex-direction:column;gap:10px}
.r{display:flex}.r.admin,.r.bot{justify-content:flex-start}.r.me,.r.user{justify-content:flex-end}.r.sys{justify-content:center}
.m{max-width:80%;border-radius:16px;padding:11px 14px;font-size:14px;line-height:1.6;white-space:pre-line}

.m.me,.m.user{background:#06C755;color:#FFF;border-radius:16px 4px 16px 16px}
.m.sys{background:#F6EDD6;color:#7A5A12;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.tag{font-size:11px;color:#9A7A2E;font-weight:600;margin-top:5px}
.m.user .tag{color:#E8FFE8}

.side{background:#14322A;color:#E9E4D6;padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.nav{text-align:left;padding:12px 14px;min-height:46px;border-radius:12px;border:none;background:transparent;color:#C9D3C9;cursor:pointer;font-size:15px}

.nav.on{background:#F5F1E8;color:#14322A;font-weight:600}
.content{padding:24px 30px 40px;display:flex;flex-direction:column;gap:20px;min-width:0}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.kpi-n{font-family:'Noto Serif Thai',Georgia,serif;font-size:34px;font-weight:700;line-height:1.1}
.cal{text-align:left;min-height:92px;padding:8px;border-radius:12px;border:1px solid #EEE8DB;background:#FFF;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:#16241D}

.cal.sel{border:2px solid #1E4D3A;background:#F2F7F3}
.cal.x{border:2px solid #B42318;background:#FFF6F5}
.th{padding:12px 14px;font-size:12px;color:#5E6B63;font-weight:600;text-align:left;white-space:nowrap}
.td{padding:13px 14px;vertical-align:top}
table{width:100%;border-collapse:collapse;font-size:14px}
tr+tr{border-top:1px solid #F1ECE1}
.cust{text-align:left;padding:12px 14px;min-height:56px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%;color:#16241D}
.cust:hover{background:#F7F4EC}
.cust.on{border:1.5px solid #1E4D3A;background:#F2F7F3}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:14px;line-height:1.55}
.alert-r{background:#FFF6F5;border:1px solid #F6C9C3;border-radius:12px;padding:12px;font-size:14px;line-height:1.55}
.alert-y{background:#FBF6E9;border:1px solid #EAD9AE;border-radius:12px;padding:12px;font-size:14px;line-height:1.55}

.task{border-radius:14px;border:1px solid #E8E1D1;background:#FFFFFF;padding:14px;display:flex;flex-direction:column;gap:6px}
.task.done{border-radius:14px;border:1px solid #B9D8C5;background:#F2F7F3;padding:14px;display:flex;flex-direction:column;gap:6px}
.ok{font:inherit;font-size:14px;padding:10px 14px;min-height:44px;border-radius:10px;border:none;background:#1E4D3A;color:#FFFFFF;font-weight:600;cursor:pointer;align-self:flex-start}
.ok.done{font:inherit;font-size:14px;padding:10px 14px;min-height:44px;border-radius:10px;border:1px solid #B9D8C5;background:#FFFFFF;color:#1E4D3A;font-weight:600;cursor:pointer;align-self:flex-start}
.warn{font-size:13px;font-weight:600;color:#912018;background:#FFF6F5;border-radius:8px;padding:6px 10px}

.upd{font-size:12px;font-weight:700;color:#7A5A12;background:#FBF0D5;border-radius:999px;padding:3px 10px;align-self:flex-start}

.line{font-size:14px;line-height:1.55}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{min-height:auto}.content{padding:16px}}
</style>

function custCalc() {
  const c = S.c, T = CTYPES.find(t => t.id === c.type), D = DATES.find(d => d.id === c.date);
  const guests = (parseInt(c.f.p1, 10) || 0) + (parseInt(c.f.p2, 10) || 0);
  const sel = UNITS.filter(u => c.sel.includes(u.id));
  const cap = sel.reduce((a, u) => a + u.cap, 0);
  const nights = D.nights.length;
  const cot = sel.filter(u => !u.group);
  const cotCost = cot.reduce((a, u) => a + (u.price || 0), 0) * nights;
  const unknown = cot.filter(u => !u.price).length;
  const lines = [];
  if (T.group) {
    lines.push({ label: 'แพ็กเกจ' + T.name, sub: guests + ' คน × 500 บาท · ที่พักกลุ่ม อาหาร 7 มื้อ กิจกรรมมาตรฐาน', amt: guests * 500 });
    if (cot.length) lines.push({ label: 'ส่วนต่างบ้านพัก (ครู / ผู้ดูแล)', sub: cot.map(u => u.name).join(', ') + ' × ' + nights + ' คืน' + (unknown ? ' · ' + unknown + ' หลังรอแอดมินแจ้งราคา' : ''), amt: cotCost });
  } else lines.push({ label: 'ค่าบ้านพัก', sub: (cot.map(u => u.name).join(', ') || '-') + ' × ' + nights + ' คืน' + (unknown ? ' · ' + unknown + ' หลังรอแอดมินแจ้งราคา' : ''), amt: cotCost });
  const total = lines.reduce((a, l) => a + l.amt, 0);
  return { T, D, guests, sel, cap, nights, lines, total, enough: guests > 0 && cap >= guests };
}

      <div class="card" style="padding:20px 22px;display:flex;flex-direction:column;gap:8px"><div class="serif" style="font-size:17px;font-weight:600">กติกาของ AI (รีสอร์ตตั้งเอง)</div><ul style="margin:0;padding-left:20px;font-size:14px;line-height:1.8"><li>ตอบได้เฉพาะคำถามที่มีคำตอบอยู่ในคลัง FAQ ของรีสอร์ต และข้อมูลบ้านว่างจาก Booking Hub</li><li>ร่างราคาได้ แต่ส่งให้ลูกค้าได้หลัง admin กดอนุมัติเท่านั้น</li><li>ไม่ยืนยันการจอง ไม่ให้ส่วนลด ไม่รับเงินเอง เรื่องเหล่านี้ส่งต่อให้คน</li><li>ขอความยินยอม (PDPA) ก่อนเก็บชื่อและเบอร์ลงประวัติลูกค้า</li></ul></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px"><div class="card" style="padding:18px"><div class="muted" style="font-size:13px">AI ตอบเองในแชตนี้</div><div class="kpi-n" style="margin-top:6px">${b.nAi}</div></div><div class="card" style="padding:18px"><div class="muted" style="font-size:13px">ส่งต่อ / รอ admin</div><div class="kpi-n" style="margin-top:6px;color:#9A7A2E">${b.nHuman}</div></div></div>
    </div></section></main>`;
}


// ---------- staff view ----------
const SUN = { dp12: 'ดอกปีบ บน 1–2', dp14: 'ดอกปีบ ล่าง 1–4', dp5: 'ดอกปีบ ล่าง 5', yt1: 'ยูงทอง 101–103', yt2: 'ยูงทอง 201–202', sh: 'Shelter 1–3', peach: 'บ้านพีช', A1: 'A1 บาหลี', A2: 'A2 ลดาวัลย์', A3: 'A3 เฟื่องฟ้า', A4: 'A4 กระดุมทอง 1', A5: 'A5 กระดุมทอง 2', B1: 'B1 ลีลาวดี', B2: 'B2 มะลิ 1', B3: 'B3 มะลิ 2', C1: 'C1 ในฝัน', C2: 'C2 ศรีตรัง', D1a: 'D1 เบิร์ด 1', D1b: 'D1 เบิร์ด 2' };
const SBK = [
  { name: 'โรงเรียน B', group: true, from: 19, to: 21, pax: 298, old: 320, arrive: '10:00', houses: ['dp12', 'dp14', 'dp5', 'yt1', 'A1', 'A2', 'A3', 'B1', 'B2', 'B3'], allergy: 'แพ้กุ้ง 3 · มังสวิรัติ 12', note: '',
    acts: [[19, '10:00', 'ลงทะเบียน ปฐมนิเทศ'], [19, '13:00', 'Adventure Park'], [19, '19:00', 'กองไฟ'], [20, '09:00', 'ล่องแก่ง'], [20, '14:00', 'ยิงธนู'], [20, '16:00', 'ส่องนก (Bird Watching)'], [21, '09:00', 'พิธีปิดค่าย']] },
  { name: 'ครอบครัว F', group: false, from: 19, to: 20, pax: 2, arrive: '15:00', houses: ['A4'], allergy: '', note: 'ฉลองครบรอบแต่งงาน ขอจัดโต๊ะริมน้ำ', acts: [[19, '16:00', 'กาแฟ Camper ริมน้ำ'], [20, '08:00', 'ล่องแก่ง']] },
  { name: 'ครอบครัว D', group: false, from: 20, to: 22, pax: 4, arrive: '14:00', houses: ['A5'], allergy: 'เด็กแพ้ถั่ว 1', note: 'เตียงเสริมเด็ก 1 เตียง', acts: [[20, '15:00', 'ล่องแก่ง'], [21, '09:00', 'ให้อาหารสัตว์'], [21, '14:00', 'Workshop สบู่ออแกนิค']] },
  { name: 'บริษัท C', group: true, from: 21, to: 23, pax: 22, arrive: '11:00', houses: ['C1', 'C2', 'D1a', 'D1b'], allergy: 'มังสวิรัติ 2', note: '', acts: [[21, '13:00', 'ทีมบิลดิ้ง'], [21, '18:00', 'พิซซ่าโฮมเมด'], [22, '09:00', 'ล่องแก่ง'], [22, '14:00', 'ยิงธนู']] },
  { name: 'ค่ายเยาวชน E', group: true, from: 23, to: 26, pax: 150, arrive: '09:30', houses: ['sh', 'yt2'], allergy: 'แพ้นมวัว 2', note: '', acts: [[23, '13:00', 'Adventure Park']] },
];
const AGE = { 'ยิงธนู': 'อายุ 10 ปีขึ้นไป', 'Workshop สบู่ออแกนิค': 'อายุ 10 ปีขึ้นไป' };
const MEALS = [['เช้า', '07:00'], ['กลางวัน', '12:00'], ['เย็น', '18:00']];
const eats = (b, d, i) => {
  if (d < b.from || d > b.to) return false;
  if (d === b.from) return i >= 1;
  if (d === b.to) return i === 0 || (i === 1 && b.group);
  return true;
};
const dl = (d) => WD[(d - 1) % 7] + ' ' + d + ' พ.ย.';

function staffBuild(team, d) {
    const out = [];
    const here = SBK.filter(b => b.from <= d && d <= b.to);
    if (team === 'kitchen') {
      MEALS.forEach(([m, t], i) => {
        const g = here.filter(b => eats(b, d, i)); if (!g.length) return;
        const n = g.reduce((a, b) => a + b.pax, 0);
        const al = g.filter(b => b.allergy).map(b => b.name + ': ' + b.allergy).join(' · ');
        const upd = g.find(b => b.old) ? 'ยอดใหม่ ' + g.find(b => b.old).name + ' ' + g.find(b => b.old).pax + ' (เดิม ' + g.find(b => b.old).old + ')' : '';
        out.push({ key: 'k' + d + i, time: t, title: 'มื้อ' + m + ' · ' + n + ' ที่', lines: g.map(b => b.name + ' ' + b.pax + ' คน'), warn: al, upd });
      });
      const tm = SBK.filter(b => [0, 1, 2].some(i => eats(b, d + 1, i)));
      const n2 = tm.reduce((a, b) => a + b.pax, 0);
      if (n2) out.push({ key: 'kb' + d, time: '15:00', title: 'ซื้อของสำหรับพรุ่งนี้', lines: ['รวมประมาณ ' + n2 + ' คน (ยอดยืนยันแล้วที่ D-2)'].concat(tm.map(b => b.name + ' ' + b.pax)), warn: '', upd: '' });
    }
    if (team === 'house') {
      here.filter(b => b.from === d).forEach(b => out.push({ key: 'hi' + d + b.name, time: 'ก่อน ' + b.arrive, title: 'เตรียมรับ ' + b.name, lines: [b.houses.map(h => SUN[h]).join(', ')], warn: b.note, upd: '' }));
      here.filter(b => b.to === d).forEach(b => out.push({ key: 'ho' + d + b.name, time: 'หลัง 11:00', title: 'ทำความสะอาดหลังเช็กเอาต์ · ' + b.name, lines: [b.houses.map(h => SUN[h]).join(', ')], warn: '', upd: '' }));
    }
    if (team === 'trainer' || team === 'venue') {
      const acts = [];
      here.forEach(b => b.acts.filter(a => a[0] === d).forEach(a => acts.push({ b, t: a[1], name: a[2] })));
      acts.sort((x, y) => x.t.localeCompare(y.t));
      if (team === 'venue') here.filter(b => b.from === d && b.group).forEach(b => out.push({ key: 'vb' + d + b.name, time: b.arrive, title: 'รถมาถึง · ' + b.name, lines: [b.pax + ' คน · จุดรับรถที่ลานจอด'], warn: '', upd: b.old ? 'ยอดใหม่ ' + b.pax + ' (เดิม ' + b.old + ')' : '' }));
      acts.forEach(x => {
        if (team === 'trainer') out.push({ key: 'ta' + d + x.t + x.name, time: x.t, title: x.name, lines: [x.b.name + ' · ' + x.b.pax + ' คน'], warn: AGE[x.name] || '', upd: x.b.old ? 'ยอดใหม่ ' + x.b.pax + ' (เดิม ' + x.b.old + ')' : '' });
        else out.push({ key: 'va' + d + x.t + x.name, time: x.t, title: 'จัดเตรียมจุด ' + x.name, lines: [x.b.name + ' · ' + x.b.pax + ' คน'], warn: '', upd: '' });
      });
      out.sort((x, y) => x.time.localeCompare(y.time));
    }
    return out;
  }

const STEAMS = [['kitchen', 'ครัว'], ['house', 'แม่บ้าน'], ['trainer', 'วิทยากร'], ['venue', 'สถานที่']];
A.sTeam = (t) => { S.s.team = t; };
A.sDay = (d) => { S.s.day = +d; };
A.sDone = (k) => { S.s.done[k] = !S.s.done[k]; };
function viewStaff() {
  const st = S.s;
  const cnt = (id) => { const l = staffBuild(id, st.day); return { l, d: l.filter(k => st.done[k.key]).length }; };
  const list = staffBuild(st.team, st.day);
  const tasks = list.map(k => { const on = !!st.done[k.key]; return `<div class="task ${on ? 'done' : ''}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><strong style="font-size:15px">${esc(k.title)}</strong><span style="font-size:13px;font-weight:700;color:#9A7A2E;white-space:nowrap">${esc(k.time)}</span></div>${k.upd ? `<span class="upd">${esc(k.upd)}</span>` : ''}${k.lines.map(l => `<div class="line">${esc(l)}</div>`).join('')}${k.warn ? `<div class="warn">${esc(k.warn)}</div>` : ''}<button class="ok ${on ? 'done' : ''}" ${act('sDone', k.key)}>${on ? 'รับทราบแล้ว (กดเพื่อยกเลิก)' : 'รับทราบ'}</button></div>`; }).join('');
  const dlab = (d) => WD[(d - 1) % 7] + ' ' + d + ' พ.ย.';
  return `<header style="background:#14322A;color:#FFF;padding:16px 32px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><div><div class="serif" style="font-size:20px;font-weight:700">KRSC Booking Hub · <span style="color:#D9B860">งานของทีม</span></div><div style="font-size:13px;color:#B9C4B9">สำหรับหัวหน้าแผนก เปิดบนมือถือ · ข้อมูลมาจากการจองชุดเดียวกับหลังบ้าน</div></div><div style="font-size:13px;color:#B9C4B9">ต้นแบบ · ข้อมูลลูกค้าเป็นตัวอย่างสมมติ</div></header>
  <div style="max-width:1180px;margin:0 auto;padding:24px 32px 40px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">
  <aside style="flex:1 1 320px;display:flex;flex-direction:column;gap:14px"><div class="card" style="padding:20px;display:flex;flex-direction:column;gap:10px"><div class="serif" style="font-size:18px;font-weight:700">ทีมเห็นอะไร</div><div class="line">แต่ละทีมเห็นเฉพาะงานของตัวเองในวันนั้น ไม่ต้องอ่านใบสั่งงานทั้งใบ กด "รับทราบ" แล้ว admin จะเห็นในหลังบ้านว่าทีมไหนยังไม่รับทราบ (R6)</div><div class="line">ถ้าลูกค้าเปลี่ยนยอดคนตอนยืนยัน D-7 ถึง D-2 ตัวเลขในหน้านี้เปลี่ยนเองและขึ้นป้าย "ยอดใหม่" (R5)</div></div>
  <div class="card" style="padding:20px;display:flex;flex-direction:column;gap:8px"><div class="serif" style="font-size:18px;font-weight:700">สถานะรับทราบ ${dlab(st.day)}</div>${STEAMS.map(([id, n]) => { const c = cnt(id); return `<div style="display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px dashed #EEE8DB"><span>${n}</span><span style="font-weight:600">${c.l.length ? (c.d === c.l.length ? 'รับทราบครบ' : 'รับทราบ ' + c.d + '/' + c.l.length) : 'ไม่มีงาน'}</span></div>`; }).join('')}</div></aside>
  <div style="flex:0 1 430px;min-width:290px;margin:0 auto;background:#0F1A16;border-radius:40px;padding:12px;box-shadow:0 24px 48px rgba(20,50,42,.25)"><div style="background:#F5F1E8;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;height:820px">
  <div style="background:#FFF;padding:14px 16px;border-bottom:1px solid #E8E1D1;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><strong style="font-size:16px">งานวันนี้ของทีม</strong><span class="muted" style="font-size:12px">${STEAMS.find(t => t[0] === st.team)[1]} · ${dlab(st.day)}</span></div>
  <div style="display:flex;gap:6px">${STEAMS.map(([id, n]) => { const c = cnt(id); return `<button class="team ${st.team === id ? 'on' : ''}" ${act('sTeam', id)}><span>${n}</span><span style="font-size:11px;opacity:.8">${c.d}/${c.l.length}</span></button>`; }).join('')}</div>
  <div style="display:flex;gap:6px;overflow-x:auto">${[19, 20, 21, 22, 23].map(d => `<button class="${st.day === d ? 'chip-on' : 'chip'}" style="white-space:nowrap" ${act('sDay', d)}>${dlab(d)}${d === 19 ? ' (วันนี้)' : ''}</button>`).join('')}</div></div>
  <div style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px">${tasks || '<div class="muted" style="font-size:14px;text-align:center;padding:30px 0">ไม่มีงานของทีมนี้ในวันนี้</div>'}</div></div></div></div>`;
}

// ---------- render ----------
function render() {
  const views = [['cust', '1. หน้าจองของลูกค้า'], ['admin', '2. หลังบ้าน (Standard)'], ['bot', '3. AI chatbot (Premium)'], ['staff', '4. งานของทีม']];
  const nav = `<div class="topnav"><span class="lbl">KRSC Booking Hub · ต้นแบบ</span>${views.map(([id, l]) => `<button class="${S.view === id ? 'tn-on' : 'tn'}" ${act('view', id)}>${l}</button>`).join('')}</div>`;
  document.getElementById('root').innerHTML = nav + (S.view === 'cust' ? viewCustomer() : S.view === 'admin' ? viewAdmin() : S.view === 'staff' ? viewStaff() : viewBot());
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  A[el.dataset.act](el.dataset.arg); render();
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.field) { S.c.f[el.dataset.field] = el.value; S.c.err2 = false; render(); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.afield) { S.a.q = el.value; render(); const q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
});
render();
</script>
</body>
</html>
